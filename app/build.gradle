plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}


android {
    namespace "com.yeshbinc.speedtest.netspeed.speedmeter"
    compileSdk  34
    defaultConfig {
        applicationId "com.yeshbinc.speedtest.netspeed.speedmeter"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        setProperty("archivesBaseName", "netspeed_" + versionName)
        vectorDrawables.useSupportLibrary true
        renderscriptTargetApi 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
//            pseudoLocalesEnabled false
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
//            pseudoLocalesEnabled false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/achartengine-1.2.0.jar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    implementation 'com.intuit.sdp:sdp-android:1.1.0'
    implementation 'com.marozzi.roundbutton:round-button:1.0.7'
    implementation 'com.github.jtv7:RippleSwitch:1.0'
    implementation 'gun0912.ted:tedpermission:2.2.3'
    implementation 'com.airbnb.android:lottie:6.4.0'
    implementation 'com.androidsx:rate-me:4.0.3'
    implementation 'com.jackandphantom.android:androidlikebutton:1.2.0'
    implementation 'com.sdsmdg.tastytoast:tastytoast:0.1.1'
    implementation 'com.github.AriesHoo:UIPopupMenu:1.0.0'
    implementation("com.squareup.okhttp3:okhttp:4.11.0")


    implementation 'com.google.android.play:core:1.10.3'

    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'com.google.android.gms:play-services-ads:23.1.0'
}
